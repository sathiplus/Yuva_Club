name: Production release - YUVA Club

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/main_yuvaclub.yml"
      - "docs/PRODUCTION_DEPLOYMENT_PLAYBOOK.md"
  pull_request:
    paths:
      - ".github/workflows/main_yuvaclub.yml"
      - "docs/PRODUCTION_DEPLOYMENT_PLAYBOOK.md"
  workflow_dispatch:
    inputs:
      operation:
        description: Deploy the expected commit or roll back to a reviewed earlier commit
        required: true
        type: choice
        options:
          - validate
          - deploy
          - rollback
      expected_commit:
        description: Full 40-character commit SHA already present on main
        required: true
        type: string
      backup_root:
        description: Verified production backup directory under /home/data
        required: true
        type: string
      confirmation:
        description: Type DEPLOY_YUVACLUB_PRODUCTION
        required: true
        type: string

concurrency:
  group: yuvaclub-production
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  APP_NAME: yuvaclub
  RESOURCE_GROUP: yuva-club-rg
  PACKAGE_NAME: yuvaclub-production.zip

jobs:
  validate:
    name: Validate exact tracked release
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.release.outputs.commit }}

    steps:
      - name: Validate release authorization inputs
        if: ${{ github.event_name == 'workflow_dispatch' }}
        shell: bash
        env:
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
          BACKUP_ROOT: ${{ inputs.backup_root }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          [[ "$CONFIRMATION" == "DEPLOY_YUVACLUB_PRODUCTION" ]]
          [[ "$EXPECTED_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$BACKUP_ROOT" =~ ^/home/data/yuva-release-1\.0\.1-[0-9]{8}T[0-9]{6}Z$ ]]

      - name: Check out expected commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.expected_commit || github.sha }}
          fetch-depth: 0

      - name: Verify commit is reviewed on main
        id: release
        shell: bash
        env:
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
        run: |
          set -euo pipefail
          ACTUAL_COMMIT="$(git rev-parse HEAD)"
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            [[ "$ACTUAL_COMMIT" == "$EXPECTED_COMMIT" ]]
          else
            EXPECTED_COMMIT="$ACTUAL_COMMIT"
          fi
          git fetch --no-tags origin main
          if [[ "${{ github.event_name }}" == "workflow_dispatch" \
                && "${{ inputs.operation }}" != "validate" ]]; then
            git merge-base --is-ancestor "$EXPECTED_COMMIT" origin/main
          fi
          [[ -z "$(git status --porcelain)" ]]
          echo "commit=$ACTUAL_COMMIT" >> "$GITHUB_OUTPUT"

      - name: Set up PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          coverage: none

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run release validation
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          php -l portal.php
          php -l portal-lib.php
          php -l parent.php
          php -l parent-media-consent.php
          php -l portal-submit-media.php
          php -l portal-delete-media.php
          php -l admin-delivery-review.php
          php -l backend/delivery/MediaConsentService.php
          php -l backend/delivery/SqlMediaConsentRepository.php
          php -l backend/delivery/MediaRetentionService.php
          php -l tools/media-retention.php
          php -l App_Data/jobs/triggered/yuva-media-retention/run.php
          php -l admin.php
          php -l registration.php
          php -l backend/authentication/PortalRepository.php
          php -l backend/authentication/StudentApprovalResolver.php
          php -l backend/authentication/StudentAuthentication.php
          php -l tests/backend/student-approval-resolver-test.php
          php -l tests/backend/filesystem-student-approval-test.php
          php -l tests/backend/admin-registration-approval-test.php
          php -l tests/backend/registration-validation-test.php
          php -l tests/backend/student-password-policy-test.php
          php -l tests/backend/demo-request-workflow-test.php
          php -l tests/backend/organization-request-approval-test.php
          php -l tests/backend/ai-mentor-media-consent-test.php
          php -l tests/backend/ai-mentor-media-retention-test.php
          php tests/backend/authentication-service-test.php
          php tests/backend/student-login-workflow-test.php
          php tests/backend/parent-login-workflow-test.php
          php tests/backend/student-approval-resolver-test.php
          python3 tools/run-isolated-validation.py \
            --source . \
            --suite tests/backend/filesystem-student-approval-test.php \
            --log-directory "$RUNNER_TEMP/filesystem-student-approval"
          php tests/backend/admin-registration-approval-test.php
          php tests/backend/registration-validation-test.php
          php tests/backend/student-password-policy-test.php
          python3 tools/run-isolated-validation.py \
            --source . \
            --suite tests/backend/demo-request-workflow-test.php \
            --log-directory "$RUNNER_TEMP/demo-request-workflow"
          python3 tools/run-isolated-validation.py \
            --source . \
            --suite tests/backend/organization-request-approval-test.php \
            --log-directory "$RUNNER_TEMP/organization-request-approval"
          php tests/backend/staging-readiness-test.php
          php tests/backend/research-submission-foundation-test.php
          php tests/backend/ai-mentor-foundation-test.php
          php tests/backend/ai-mentor-phase1a-contract-test.php
          php tests/backend/ai-mentor-phase1b-contract-test.php
          php tests/backend/ai-mentor-phase1b-document-test.php
          php tests/backend/ai-mentor-phase1c-delivery-test.php
          php tests/backend/ai-mentor-media-consent-test.php
          php tests/backend/ai-mentor-media-retention-test.php
          php tests/migrations/migration-framework-test.php
          node tests/frontend/public-site-contract-test.mjs
          node tests/frontend/password-visibility-contract-test.mjs
          node tests/frontend/demo-request-contract-test.mjs
          node tests/frontend/student-experience-contract-test.mjs
          node tests/frontend/parent-experience-contract-test.mjs
          node tests/frontend/master-admin-contract-test.mjs
          node tests/frontend/ai-mentor-contract-test.mjs
          node tests/frontend/ai-mentor-phase1a-contract-test.mjs
          node tests/frontend/ai-mentor-phase1c-contract-test.mjs

      - name: Build tracked-files-only ZIP
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/build-release-artifact.py \
            --commit HEAD \
            --output "$PACKAGE_NAME" \
            --exclusions tools/release-artifact-exclusions.txt \
            --inventory "$PACKAGE_NAME.inventory.json"
          python3 tests/release-artifact-tooling-test.py
          sha256sum "$PACKAGE_NAME" | tee "$PACKAGE_NAME.sha256"

      - name: Verify production safety controls are present
        shell: bash
        run: |
          set -euo pipefail
          WORKFLOW=.github/workflows/main_yuvaclub.yml
          grep -q 'workflow_dispatch:' "$WORKFLOW"
          grep -q 'group: yuvaclub-production' "$WORKFLOW"
          grep -q 'cancel-in-progress: false' "$WORKFLOW"
          grep -q 'environment: production' "$WORKFLOW"
          grep -q 'git merge-base --is-ancestor' "$WORKFLOW"
          grep -q 'build-release-artifact.py' "$WORKFLOW"
          grep -q 'OVERALL_VERIFY=PASS' "$WORKFLOW"
          grep -q 'sha256sum -c.*submissions.sha256' "$WORKFLOW"
          grep -q 'retention-days: 90' "$WORKFLOW"
          grep -q 'Public production smoke tests' "$WORKFLOW"
          grep -q -- '--clean false' "$WORKFLOW"

      - name: Retain exact release package for rollback
        uses: actions/upload-artifact@v4
        with:
          name: yuvaclub-production-${{ steps.release.outputs.commit }}
          path: |
            ${{ env.PACKAGE_NAME }}
            ${{ env.PACKAGE_NAME }}.sha256
            ${{ env.PACKAGE_NAME }}.inventory.json
          if-no-files-found: error
          retention-days: 90

  deploy:
    name: Approved production deployment
    needs: validate
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.operation != 'validate' }}
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Download exact validated package
        uses: actions/download-artifact@v4
        with:
          name: yuvaclub-production-${{ needs.validate.outputs.commit }}

      - name: Verify package checksum
        shell: bash
        run: sha256sum -c "$PACKAGE_NAME.sha256"

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_2B6D29C3A654441C8FB44AF53746AE54 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_BDFA041E98CB4199B60D5D7655791CD6 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_BD3F45D129824F03AABB4458EF0C5F5C }}

      - name: Verify production backup and mutable manifests
        shell: bash
        env:
          BACKUP_ROOT: ${{ inputs.backup_root }}
        run: |
          set -euo pipefail
          REMOTE_COMMAND="test -f '$BACKUP_ROOT/verification-report.txt' \
            && grep -qx 'OVERALL_VERIFY=PASS' '$BACKUP_ROOT/verification-report.txt' \
            && test -f '$BACKUP_ROOT/manifests/submissions.sha256' \
            && test -f '$BACKUP_ROOT/manifests/portal-data.sha256' \
            && test -f '$BACKUP_ROOT/manifests/portal-uploads.sha256' \
            && cd /home/site/wwwroot/submissions \
            && sha256sum -c '$BACKUP_ROOT/manifests/submissions.sha256' \
            && cd /home/site/wwwroot/portal-data \
            && sha256sum -c '$BACKUP_ROOT/manifests/portal-data.sha256' \
            && cd /home/site/wwwroot/portal-uploads \
            && sha256sum -c '$BACKUP_ROOT/manifests/portal-uploads.sha256' \
            && echo RELEASE_BACKUP_VERIFIED"
          {
            sleep 12
            printf '\n'
            sleep 1
            printf '%s\n' "$REMOTE_COMMAND"
            sleep 2
            printf 'exit\n'
          } | timeout 90 az webapp ssh \
                --resource-group "$RESOURCE_GROUP" \
                --name "$APP_NAME" | tee backup-verification.log
          grep -q 'RELEASE_BACKUP_VERIFIED' backup-verification.log

      - name: Capture exact mutable production inventory
        shell: bash
        run: |
          set -euo pipefail
          REMOTE_COMMAND="cd /home/site/wwwroot \
            && echo MUTABLE_INVENTORY_BEGIN \
            && for directory in portal-data portal-uploads submissions; do \
                 find \"\$directory\" -type f -print0 | sort -z | xargs -0 -r sha256sum; \
               done \
            && echo MUTABLE_INVENTORY_END"
          {
            sleep 12
            printf '\n'
            sleep 1
            printf '%s\n' "$REMOTE_COMMAND"
            sleep 2
            printf 'exit\n'
          } | timeout 90 az webapp ssh \
                --resource-group "$RESOURCE_GROUP" \
                --name "$APP_NAME" | tee mutable-before.log
          sed -n '/^MUTABLE_INVENTORY_BEGIN$/,/^MUTABLE_INVENTORY_END$/p' \
            mutable-before.log > mutable-before.sha256
          test -s mutable-before.sha256

      - name: Deploy without cleaning persistent wwwroot content
        shell: bash
        run: |
          set -euo pipefail
          az webapp deploy \
            --resource-group "$RESOURCE_GROUP" \
            --name "$APP_NAME" \
            --src-path "$PACKAGE_NAME" \
            --type zip \
            --clean false \
            --restart true \
            --track-status true \
            --timeout 600000

      - name: Verify mutable production records
        shell: bash
        env:
          BACKUP_ROOT: ${{ inputs.backup_root }}
        run: |
          set -euo pipefail
          REMOTE_COMMAND="cd /home/site/wwwroot/submissions \
            && sha256sum -c '$BACKUP_ROOT/manifests/submissions.sha256' \
            && cd /home/site/wwwroot/portal-data \
            && sha256sum -c '$BACKUP_ROOT/manifests/portal-data.sha256' \
            && cd /home/site/wwwroot/portal-uploads \
            && sha256sum -c '$BACKUP_ROOT/manifests/portal-uploads.sha256' \
            && echo MUTABLE_RECORDS_VERIFIED"
          {
            sleep 12
            printf '\n'
            sleep 1
            printf '%s\n' "$REMOTE_COMMAND"
            sleep 3
            printf 'exit\n'
          } | timeout 120 az webapp ssh \
                --resource-group "$RESOURCE_GROUP" \
                --name "$APP_NAME" | tee mutable-verification.log
          grep -q 'MUTABLE_RECORDS_VERIFIED' mutable-verification.log

      - name: Compare exact mutable production inventory
        shell: bash
        run: |
          set -euo pipefail
          REMOTE_COMMAND="cd /home/site/wwwroot \
            && echo MUTABLE_INVENTORY_BEGIN \
            && for directory in portal-data portal-uploads submissions; do \
                 find \"\$directory\" -type f -print0 | sort -z | xargs -0 -r sha256sum; \
               done \
            && echo MUTABLE_INVENTORY_END"
          {
            sleep 12
            printf '\n'
            sleep 1
            printf '%s\n' "$REMOTE_COMMAND"
            sleep 2
            printf 'exit\n'
          } | timeout 90 az webapp ssh \
                --resource-group "$RESOURCE_GROUP" \
                --name "$APP_NAME" | tee mutable-after.log
          sed -n '/^MUTABLE_INVENTORY_BEGIN$/,/^MUTABLE_INVENTORY_END$/p' \
            mutable-after.log > mutable-after.sha256
          cmp mutable-before.sha256 mutable-after.sha256
          echo MUTABLE_INVENTORY_EXACT_MATCH

      - name: Public production smoke tests
        shell: bash
        run: |
          set -euo pipefail
          for path in / /registration.php /portal-login.php /parent-login.php /admin-login.php /privacy.html /terms.html /contact.html; do
            curl --fail --silent --show-error \
              --retry 3 --retry-delay 3 \
              "https://www.yuvaclub.app${path}" >/dev/null
          done
          registration_health="$(curl --fail --silent --show-error \
            --retry 3 --retry-delay 3 \
            'https://www.yuvaclub.app/submit-registration.php?health=1')"
          jq -e \
            '.database_configured == true and .database_connected == true' \
            <<<"$registration_health" >/dev/null

      - name: Record deployment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-evidence-${{ needs.validate.outputs.commit }}
          path: |
            backup-verification.log
            mutable-verification.log
          if-no-files-found: warn
          retention-days: 90
