<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Master Admin Responsive Capture</title>
  <style>
    html, body { margin: 0; background: #dfe5f0; }
    iframe { display: block; border: 0; background: #f5f7fc; }
    .mobile { width: 390px; height: 844px; }
    .tablet { width: 768px; height: 1024px; }
    .desktop { width: 1440px; height: 900px; }
  </style>
</head>
<body>
  <iframe id="capture" title="Master Admin preview" src="master-admin-preview.html"></iframe>
  <script>
    const size = new URLSearchParams(window.location.search).get('size');
    document.querySelector('#capture').className = ['mobile', 'tablet', 'desktop'].includes(size)
      ? size
      : 'desktop';
  </script>
</body>
</html>
